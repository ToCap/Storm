edition = "2023";

package mindstorm;

enum OdometrySensorModes
{
	MEASURE = 0;
	COMPARE = 1;
}

message OdometrySensorData {
	uint64 timestamp = 1;
	OdometrySensorModes mode = 2;

	// Number of rotations in degresses since the last reset
	uint64 degrees  = 3;

	// 	Number of rotations since the last reset
	uint64 rotations = 4;
	
	// Current motor power level (-100 to 100)
	int32 cuurentPower = 5;

}
