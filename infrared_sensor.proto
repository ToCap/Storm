edition = "2023";

package mindstorm;

enum InfraredSensorModes
{
	PROXIMITY = 0;
	DETECTED = 1;
	HEADING = 2;
}

message InfraredSensorData {
	uint64 timestamp = 1;
	InfraredSensorModes mode = 2;

	oneof payload {
		ProximityData   proximity      = 3;
		DetectedData    detected       = 4;
		HeadingData     heading        = 5;
  }
}

message ProximityData {
  uint32 value = 1; // Expected range: 0–100
}

message DetectedData {
  bool state = 1;
}

message HeadingData {
  sint32 heading = 1; // Expected range: -25 to +25
}
